# Every push and pull request, on GitHub-hosted runners. No model needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and Postgres tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: care
          POSTGRES_PASSWORD: care
          POSTGRES_DB: care_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U care -d care_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      CARE_TEST_DATABASE_URL: postgresql://care:care@localhost:5432/care_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      # test_live.py skips itself: there's no Ollama here.
      - name: Run tests
        run: pytest -ra

  ansible:
    name: Playbooks and compose file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ansible-lint
        run: pip install ansible-lint
      - name: Syntax check
        run: |
          for p in start stop; do
            ansible-playbook -i deploy/ansible/inventory.ini deploy/ansible/$p.yml --syntax-check
          done
      - name: Lint
        run: ansible-lint --profile production deploy/ansible/start.yml deploy/ansible/stop.yml
      - name: Validate compose.yaml
        run: docker compose config --quiet
